<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <filter id="fuseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid9" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad9)"/>
  <rect width="800" height="450" fill="url(#grid9)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="250" height="28" rx="6" fill="#854d0e" fill-opacity="0.4" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#facc15"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#fef08a" letter-spacing="1.2">BOÎTE À FUSIBLES &amp; RELAIS</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.8">CONTINUITÉ FILAMENT : 0.0 Ω</text>
  </g>

  <!-- Left: Automotive Blade Fuse Comparison (Intact vs Blown) -->
  <g transform="translate(80, 100)">
    <!-- INTACT FUSE (15A Blue) -->
    <g transform="translate(30, 20)">
      <!-- Plastic Body (Transparent Blue) -->
      <path d="M 10 20 L 70 20 L 75 80 L 5 80 Z" fill="#2563eb" fill-opacity="0.85" stroke="#60a5fa" stroke-width="2"/>
      <rect x="22" y="10" width="36" height="12" rx="3" fill="#1e40af"/>
      <text x="40" y="55" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">15</text>
      
      <!-- Metal Prongs Blades -->
      <rect x="12" y="80" width="16" height="50" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <rect x="52" y="80" width="16" height="50" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

      <!-- Intact S-shaped Filament (Continuous) -->
      <path d="M 20 80 Q 40 45 40 30 Q 40 45 60 80" fill="none" stroke="#facc15" stroke-width="4.5" stroke-linecap="round" filter="url(#fuseGlow)"/>

      <text x="40" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399">FUSIBLE INTACT (OK)</text>
      <text x="40" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Filament continu</text>
    </g>

    <!-- BLOWN FUSE (20A Yellow) -->
    <g transform="translate(180, 20)">
      <!-- Plastic Body (Transparent Yellow) -->
      <path d="M 10 20 L 70 20 L 75 80 L 5 80 Z" fill="#ca8a04" fill-opacity="0.85" stroke="#facc15" stroke-width="2"/>
      <rect x="22" y="10" width="36" height="12" rx="3" fill="#854d0e"/>
      <text x="40" y="55" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">20</text>
      
      <!-- Metal Prongs Blades -->
      <rect x="12" y="80" width="16" height="50" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <rect x="52" y="80" width="16" height="50" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

      <!-- Melted Broken Filament with Burn Mark -->
      <path d="M 20 80 Q 28 55 32 45" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
      <path d="M 60 80 Q 52 55 48 45" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
      <!-- Burn Mark Blast -->
      <circle cx="40" cy="40" r="10" fill="#000000" fill-opacity="0.7"/>
      <line x1="34" y1="35" x2="46" y2="45" stroke="#ef4444" stroke-width="2"/>

      <text x="40" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f87171">FUSIBLE GRILLÉ (HS)</text>
      <text x="40" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#fca5a5">Filament fondu / coupé</text>
    </g>

    <!-- Fuse Puller Tool (Pince à fusibles blanche) -->
    <g transform="translate(300, 35)">
      <path d="M 15 10 L 25 10 L 22 70 L 32 100 L 18 100 L 18 70 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="25" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#cbd5e1">Pince</text>
    </g>
  </g>

  <!-- Right: Fuse Box Color Code &amp; Amperage Guide -->
  <g transform="translate(470, 105)">
    <rect width="290" height="240" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="145" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">CODE COULEUR DES FUSIBLES (DIN 72581)</text>

    <!-- Color Rows -->
    <g transform="translate(20, 50)">
      <!-- 10A Red -->
      <rect x="0" y="0" width="30" height="22" rx="4" fill="#dc2626"/>
      <text x="42" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">10A Rouge : Feux, Calculateur moteur</text>

      <!-- 15A Blue -->
      <rect x="0" y="32" width="30" height="22" rx="4" fill="#2563eb"/>
      <text x="42" y="48" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">15A Bleu : Pompe à carburant, Essuie-glaces</text>

      <!-- 20A Yellow -->
      <rect x="0" y="64" width="30" height="22" rx="4" fill="#ca8a04"/>
      <text x="42" y="80" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">20A Jaune : Allume-cigare, Toit ouvrant</text>

      <!-- 25A Clear/White -->
      <rect x="0" y="96" width="30" height="22" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="42" y="112" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">25A Blanc : Chauffage, Climatisation</text>

      <!-- 30A Green -->
      <rect x="0" y="128" width="30" height="22" rx="4" fill="#16a34a"/>
      <text x="42" y="144" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">30A Vert : Démarreur, Groupe motoventilateur</text>
    </g>

    <text x="145" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#fbbf24">
      Règle : Ne jamais remplacer par un ampérage supérieur
    </text>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Extrayez le fusible avec la pince plastique. Observez à contre-jour l’état du filament conducteur en U.
    </text>
  </g>
</svg>