<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="oilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid11" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad11)"/>
  <rect width="800" height="450" fill="url(#grid11)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="250" height="28" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#f59e0b"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde68a" letter-spacing="1.2">NIVEAU &amp; PRESSION D'HUILE</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">ZONE HACHURÉE : MIN - MAX</text>
  </g>

  <!-- Oil Dipstick &amp; Sump Schematic -->
  <g transform="translate(100, 100)">
    <!-- Engine Block Outline (Partial) -->
    <path d="M 50 160 L 340 160 L 340 280 L 50 280 Z" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    
    <!-- Yellow Dipstick Handle Ring (Tirant de jauge jaune) -->
    <g transform="translate(80, 20)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#eab308" stroke-width="6" filter="url(#oilGlow)"/>
      <rect x="14" y="38" width="12" height="20" rx="3" fill="#ca8a04"/>
      <text x="20" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#fde047">Jauge</text>
    </g>

    <!-- Metal Dipstick Blade (Lame métallique graduée) -->
    <g transform="translate(97, 60)">
      <rect x="0" y="0" width="6" height="220" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
      
      <!-- Measuring Tip Area (Cross-hatched safe zone) -->
      <g transform="translate(-10, 140)">
        <!-- Tip Background -->
        <rect x="7" y="0" width="12" height="70" fill="#94a3b8" rx="2"/>
        
        <!-- Amber Fresh Oil Film on Tip -->
        <rect x="7" y="20" width="12" height="50" fill="url(#oilGrad)" rx="2"/>

        <!-- MAX Hole &amp; Mark -->
        <circle cx="13" cy="20" r="2.5" fill="#0f172a"/>
        <line x1="22" y1="20" x2="45" y2="20" stroke="#f8fafc" stroke-width="2"/>
        <text x="50" y="24" font-family="sans-serif" font-size="11" font-weight="900" fill="#f8fafc">MAX</text>

        <!-- Hatch Pattern in Safe Zone -->
        <line x1="9" y1="30" x2="17" y2="25" stroke="#78350f" stroke-width="1.5"/>
        <line x1="9" y1="40" x2="17" y2="35" stroke="#78350f" stroke-width="1.5"/>
        <line x1="9" y1="50" x2="17" y2="45" stroke="#78350f" stroke-width="1.5"/>

        <!-- MIN Hole &amp; Mark -->
        <circle cx="13" cy="60" r="2.5" fill="#0f172a"/>
        <line x1="22" y1="60" x2="45" y2="60" stroke="#f59e0b" stroke-width="2"/>
        <text x="50" y="64" font-family="sans-serif" font-size="11" font-weight="900" fill="#fbbf24">MIN</text>

        <!-- Oil Level Arrow -->
        <g transform="translate(110, 20)">
          <path d="M 0 0 L -40 0" stroke="#10b981" stroke-width="2.5"/>
          <polygon points="-40,0 -32,-4 -32,4" fill="#10b981"/>
          <text x="6" y="4" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">Niveau Optimal</text>
        </g>
      </g>
    </g>

    <!-- Yellow Oil Filler Cap 710 -->
    <g transform="translate(260, 120)">
      <rect x="0" y="0" width="60" height="25" rx="5" fill="#ca8a04" stroke="#facc15" stroke-width="2"/>
      <circle cx="30" cy="12" r="6" fill="#0f172a"/>
      <text x="30" y="38" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fde047">Bouchon 5W30</text>
    </g>
  </g>

  <!-- Oil Quality Evaluation Card -->
  <g transform="translate(520, 110)">
    <rect width="240" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">ASPECT VISUEL DE L'HUILE</text>

    <!-- Drops Evaluation -->
    <g transform="translate(20, 50)">
      <circle cx="18" cy="20" r="10" fill="#ca8a04"/>
      <text x="38" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#fde047">Ambre Translucide</text>
      <text x="38" y="32" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Huile saine, viscosité nominale</text>
    </g>

    <g transform="translate(20, 105)">
      <circle cx="18" cy="20" r="10" fill="#1e293b" stroke="#000000" stroke-width="2"/>
      <text x="38" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Noire Épaisse / Suie</text>
      <text x="38" y="32" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Vidange recommandée</text>
    </g>

    <g transform="translate(20, 160)">
      <circle cx="18" cy="20" r="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <text x="38" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Pâte Blanchâtre (« Mayonnaise »)</text>
      <text x="38" y="32" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#ef4444">Alerte : Fuite joint de culasse</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Tirez la jauge, essuyez avec un chiffon propre, réinsérez à fond et retirez pour lire le niveau exact.
    </text>
  </g>
</svg>