<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <filter id="beltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid14" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad14)"/>
  <rect width="800" height="450" fill="url(#grid14)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="270" height="28" rx="6" fill="#854d0e" fill-opacity="0.4" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#facc15"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#fef08a" letter-spacing="1.2">COURROIES &amp; TENSION</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">DÉFLEXION : 5 - 10 MM MAX</text>
  </g>

  <!-- Serpentine Belt Routing &amp; Pulleys Schematic -->
  <g transform="translate(100, 100)">
    <!-- Crankshaft Lower Pulley (Damper) -->
    <circle cx="120" cy="200" r="55" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <circle cx="120" cy="200" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#cbd5e1">Poulie Damper (Vilebrequin)</text>

    <!-- Alternator Upper Right Pulley -->
    <circle cx="320" cy="80" r="38" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <circle cx="320" cy="80" r="14" fill="#0f172a"/>
    <text x="320" y="35" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#cbd5e1">Alternateur</text>

    <!-- Water Pump / AC Compressor Lower Right Pulley -->
    <circle cx="320" cy="220" r="45" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <circle cx="320" cy="220" r="16" fill="#0f172a"/>
    <text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#cbd5e1">Compresseur Clim</text>

    <!-- Automatic Belt Tensioner Pulley (Galet Tendeur) -->
    <g transform="translate(200, 120)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5" filter="url(#beltGlow)"/>
      <circle cx="0" cy="0" r="10" fill="#ca8a04"/>
      <!-- Tension Spring Indicator Arrow -->
      <path d="M 0 -28 C 15 -28, 25 -15, 25 0" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="900" fill="#fbbf24">Galet Tendeur</text>
    </g>

    <!-- Serpentine Belt Path (Thick Black &amp; Gold Edge) -->
    <path d="M 120 145 L 320 42 C 360 42, 360 118, 320 118 L 228 120 C 180 120, 180 148, 220 180 L 320 175 C 370 175, 370 265, 320 265 L 120 255 C 60 255, 60 145, 120 145 Z" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <path d="M 120 145 L 320 42 C 360 42, 360 118, 320 118 L 228 120 C 180 120, 180 148, 220 180 L 320 175 C 370 175, 370 265, 320 265 L 120 255 C 60 255, 60 145, 120 145 Z" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

    <!-- Deflection Force Test Arrow -->
    <g transform="translate(210, 80)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ef4444" stroke-width="2.5"/>
      <polygon points="0,28 -4,20 4,20" fill="#ef4444"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#f87171">Flèche 8 mm</text>
    </g>
  </g>

  <!-- Inspection Diagnosis Card -->
  <g transform="translate(520, 110)">
    <rect width="240" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">ANALYSE D'USURE COURROIE</text>

    <!-- Crack Inspection -->
    <g transform="translate(20, 50)">
      <rect width="200" height="50" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="25" r="7" fill="#ef4444"/>
      <text x="36" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">Craquelures / Effilochage</text>
      <text x="36" y="36" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Caoutchouc cuit : Remplacement</text>
    </g>

    <!-- Glazing / Noise Inspection -->
    <g transform="translate(20, 110)">
      <rect width="200" height="50" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="25" r="7" fill="#f59e0b"/>
      <text x="36" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Surface Glacée / Cirée</text>
      <text x="36" y="36" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Couinement aigu à froid</text>
    </g>

    <!-- Normal State -->
    <g transform="translate(20, 170)">
      <rect width="200" height="50" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="25" r="7" fill="#10b981"/>
      <text x="36" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Stries Nettes &amp; Souples</text>
      <text x="36" y="36" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Tension nominale préservée</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Pincez le brin le plus long avec deux doigts : la courroie ne doit pas pouvoir pivoter à plus d’un quart de tour (90°).
    </text>
  </g>
</svg>