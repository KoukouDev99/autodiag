<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="coolantFluo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="coolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid7" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad7)"/>
  <rect width="800" height="450" fill="url(#grid7)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="270" height="28" rx="6" fill="#831843" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#fb7185"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#fecdd3" letter-spacing="1.2">CIRCUIT DE REFROIDISSEMENT</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.8">TEMPÉRATURE : 88°C - 95°C</text>
  </g>

  <!-- Expansion Tank (Vase d'expansion) Schematic -->
  <g transform="translate(130, 95)">
    <!-- Semi-transparent Tank Body Outer -->
    <path d="M 60 80 Q 50 200 80 250 Q 150 270 240 250 Q 270 200 260 80 Z" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    
    <!-- Coolant Liquid Level (Pink/G12 Long-Life Coolant) -->
    <path d="M 66 140 Q 160 145 254 140 Q 262 200 235 245 Q 150 262 85 245 Q 58 200 66 140 Z" fill="url(#coolantFluo)" filter="url(#coolGlow)"/>

    <!-- Tank Pressure Cap (Blue/Yellow with Warning Valve) -->
    <rect x="120" y="45" width="80" height="35" rx="6" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="160" cy="62" r="9" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <text x="160" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#facc15">!</text>

    <!-- Upper Return Overflow Hose -->
    <path d="M 255 100 L 310 100 L 310 160" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <path d="M 255 100 L 310 100 L 310 160" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Bottom Feeding Hose to Water Pump -->
    <path d="M 160 260 L 160 300 L 220 300" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
    <path d="M 160 260 L 160 300 L 220 300" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>

    <!-- Level Marks MAX &amp; MIN -->
    <line x1="45" y1="130" x2="80" y2="130" stroke="#f8fafc" stroke-width="2.5"/>
    <text x="35" y="134" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="900" fill="#f8fafc">MAX</text>

    <line x1="50" y1="180" x2="85" y2="180" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="40" y="184" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="900" fill="#fbbf24">MIN</text>

    <!-- Liquid Meniscus Highlight -->
    <ellipse cx="160" cy="140" rx="90" ry="7" fill="#f472b6" fill-opacity="0.6"/>
  </g>

  <!-- Coolant Safety &amp; Thermostat Verification Box -->
  <g transform="translate(500, 110)">
    <rect width="260" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="130" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">CONTRÔLES THERMIQUES</text>

    <!-- Temperature Gauge Status -->
    <g transform="translate(20, 50)">
      <rect width="220" height="50" rx="8" fill="#1e293b"/>
      <circle cx="25" cy="25" r="10" fill="#10b981"/>
      <text x="45" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Durite Haute Chaude</text>
      <text x="45" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Thermostat (Calorstat) s'ouvre à 90°C</text>
    </g>

    <!-- Color Quality Status -->
    <g transform="translate(20, 110)">
      <rect width="220" height="50" rx="8" fill="#1e293b"/>
      <circle cx="25" cy="25" r="10" fill="#ec4899"/>
      <text x="45" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Liquide Limpide (Rose / Bleu)</text>
      <text x="45" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Absence d'émulsion « mayonnaise »</text>
    </g>

    <!-- Safety Warning Inside Box -->
    <g transform="translate(20, 170)">
      <rect width="220" height="50" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
      <text x="110" y="22" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#fca5a5">DANGER DE BRÛLURE</text>
      <text x="110" y="38" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#fecaca">Ne jamais ouvrir le bouchon à chaud</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : À froid sur sol plat, le niveau doit se trouver strictement entre le repère MIN et MAX.
    </text>
  </g>
</svg>