<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <filter id="absGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid8" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad8)"/>
  <rect width="800" height="450" fill="url(#grid8)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="250" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.2">CAPTEUR DE VITESSE ABS</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">ENTREFER CIBLE : 0.5 - 1.2 MM</text>
  </g>

  <!-- Toothed Reluctor Tone Ring &amp; Sensor Probe Schematic -->
  <g transform="translate(100, 100)">
    <!-- Toothed Wheel Hub Reluctor Ring -->
    <g transform="translate(160, 150)">
      <circle cx="0" cy="0" r="110" fill="#1e293b" stroke="#475569" stroke-width="4"/>
      <!-- Hub Bearing Center -->
      <circle cx="0" cy="0" r="60" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
      <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- 48 Teeth Gear Ring Outline (Toothed Tone Ring) -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#f59e0b" stroke-width="14" stroke-dasharray="10 4" filter="url(#absGlow)"/>
      <text x="0" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24">CIBLE DENTÉE 48 DENTS</text>
    </g>

    <!-- ABS Sensor Probe Body (Black plastic / Brass nose) -->
    <g transform="translate(255, 30)">
      <!-- Mounting Bracket with 10mm Bolt Hole -->
      <rect x="0" y="20" width="35" height="50" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="17" cy="35" r="5.5" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>
      
      <!-- Sensor Cylindrical Probe Shaft -->
      <rect x="12" y="70" width="16" height="55" rx="3" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
      <!-- Magnetic Hall Pickup Tip (Red/Gold) -->
      <rect x="14" y="125" width="12" height="6" fill="#f59e0b"/>
      
      <!-- Sensor Harness Cable -->
      <path d="M 17 20 C 17 -10, 80 -10, 120 10" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
      <path d="M 17 20 C 17 -10, 80 -10, 120 10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      
      <!-- 2-Pin Waterproof Connector -->
      <g transform="translate(120, 0)">
        <rect width="45" height="25" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="15" cy="12" r="3" fill="#fbbf24"/>
        <circle cx="30" cy="12" r="3" fill="#fbbf24"/>
        <text x="22" y="38" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">Connecteur 2 voies</text>
      </g>
    </g>

    <!-- Magnetic Air Gap (Entrefer) Indicator -->
    <g transform="translate(270, 160)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#f43f5e" stroke-width="2"/>
      <polygon points="0,0 6,-3 6,3" fill="#f43f5e"/>
      <text x="42" y="4" font-family="sans-serif" font-size="11" font-weight="800" fill="#fb7185">Entrefer 0.8 mm</text>
    </g>
  </g>

  <!-- Oscilloscope / Multimeter Signal Card -->
  <g transform="translate(530, 110)">
    <rect width="230" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="115" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">SIGNAL CAPTEUR ROUE</text>

    <!-- Scope Screen with Square Wave / Sine Wave -->
    <rect x="20" y="50" width="190" height="100" rx="8" fill="#042f2e" stroke="#0f766e" stroke-width="1.5"/>
    <!-- Grid -->
    <line x1="20" y1="100" x2="210" y2="100" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="115" y1="50" x2="115" y2="150" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="4 4"/>
    
    <!-- Digital Square Wave (Active Hall Sensor Signal) -->
    <path d="M 30 115 L 50 115 L 50 85 L 70 85 L 70 115 L 90 115 L 90 85 L 110 85 L 110 115 L 130 115 L 130 85 L 150 85 L 150 115 L 170 115 L 170 85 L 190 85" fill="none" stroke="#2dd4bf" stroke-width="2.5" filter="url(#absGlow)"/>

    <!-- Signal Stats -->
    <text x="30" y="140" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#5eead4">FRÉQ : 450 Hz · 5V</text>

    <!-- Resistance Value (For passive sensors: 1000 - 1600 Ohms) -->
    <g transform="translate(20, 165)">
      <rect width="190" height="50" rx="6" fill="#1e293b"/>
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Résistance nominale :</text>
      <text x="12" y="38" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">1 100 à 1 600 Ω (Passif)</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Nettoyez la poussière de frein et la limaille sur la cible. Contrôlez l’intégrité du câble dans le passage de roue.
    </text>
  </g>
</svg>