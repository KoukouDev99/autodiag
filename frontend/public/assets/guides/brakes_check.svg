<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="caliperRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="padGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad6)"/>
  <rect width="800" height="450" fill="url(#grid6)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="260" height="28" rx="6" fill="#991b1b" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#f87171"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="1.2">SYSTÈME DE FREINAGE</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.8">ÉPAISSEUR GARNITURE &gt; 3 MM</text>
  </g>

  <!-- Ventilated Brake Disc Rotor &amp; Floating Caliper -->
  <g transform="translate(140, 95)">
    <!-- Ventilated Rotor Disc Plate -->
    <circle cx="170" cy="145" r="130" fill="url(#discGrad)" stroke="#475569" stroke-width="3"/>
    
    <!-- Ventilation Holes / Slots (Sport drilled rotor pattern) -->
    <g transform="translate(170, 145)" fill="#0f172a">
      <circle cx="0" cy="0" r="55" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
      <!-- 5 Wheel Lug Bolt Holes -->
      <circle cx="0" cy="-35" r="7"/>
      <circle cx="33" cy="-11" r="7"/>
      <circle cx="21" cy="28" r="7"/>
      <circle cx="-21" cy="28" r="7"/>
      <circle cx="-33" cy="-11" r="7"/>
      <!-- Center Axle Bore -->
      <circle cx="0" cy="0" r="18" fill="#0f172a"/>
      
      <!-- Cross Drilled Cooling Vents -->
      <circle cx="65" cy="50" r="3.5"/>
      <circle cx="75" cy="40" r="3.5"/>
      <circle cx="85" cy="30" r="3.5"/>
      <circle cx="65" cy="-50" r="3.5"/>
      <circle cx="75" cy="-40" r="3.5"/>
      <circle cx="85" cy="-30" r="3.5"/>
      <circle cx="-65" cy="50" r="3.5"/>
      <circle cx="-75" cy="40" r="3.5"/>
      <circle cx="-85" cy="30" r="3.5"/>
    </g>

    <!-- Brake Caliper Body (Red Performance Style) -->
    <path d="M 230 40 C 330 60, 340 180, 280 240 L 220 220 C 260 170, 250 90, 200 60 Z" fill="url(#caliperRed)" stroke="#f87171" stroke-width="2.5" filter="url(#padGlow)"/>
    
    <!-- Bleeder Screw Nipple -->
    <rect x="250" y="25" width="10" height="18" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    <!-- Flexible Hydraulic Brake Hose -->
    <path d="M 270 30 C 310 0, 360 10, 380 40" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Brake Pads Inspection Window -->
    <rect x="240" y="105" width="45" height="70" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="245" y="115" width="10" height="50" fill="#f59e0b"/>
    <text x="250" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#1e293b" transform="rotate(-90 250,145)">8 mm</text>
    
    <!-- Caliper Slider Guide Pins -->
    <circle cx="295" cy="75" r="7" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="265" cy="225" r="7" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Brake Pad Wear Gauge Scale Card -->
  <g transform="translate(530, 110)">
    <rect width="230" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="115" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">JAUGE D'USURE PLAQUETTES</text>

    <!-- Wear Scale Progress Bars -->
    <g transform="translate(20, 50)">
      <!-- Green Zone (> 5mm) -->
      <rect x="0" y="0" width="190" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399">&gt; 5 mm : État Conforme</text>

      <!-- Yellow Warning (3 - 5mm) -->
      <rect x="0" y="44" width="190" height="34" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="66" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24">3 - 5 mm : À surveiller</text>

      <!-- Red Danger (< 3mm) -->
      <rect x="0" y="88" width="190" height="34" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="12" y="110" font-family="sans-serif" font-size="12" font-weight="800" fill="#fca5a5">&lt; 3 mm : Remplacement Urgent</text>
    </g>

    <!-- Inspection Criteria -->
    <text x="20" y="195" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
      • Absence de rayure profonde sur disque
    </text>
    <text x="20" y="215" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
      • Niveau liquide bocal entre MIN et MAX
    </text>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Vérifiez l’épaisseur de la garniture de frein à travers les ajours de jante sans démonter.
    </text>
  </g>
</svg>