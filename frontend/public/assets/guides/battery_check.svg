<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="battBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="210" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.2">CONTRÔLE CIRCUIT 12V</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(570, 36)">
    <rect width="190" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="95" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">TENSION NOMINALE > 12.4V</text>
  </g>

  <!-- Main Illustration: 12V Car Battery -->
  <g transform="translate(100, 100)">
    <!-- Battery Outer Case -->
    <rect x="50" y="80" width="360" height="220" rx="14" fill="url(#battBody)" stroke="#334155" stroke-width="3"/>
    
    <!-- Top Cover &amp; Handles -->
    <rect x="70" y="60" width="320" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <path d="M 120 60 L 120 30 L 340 30 L 340 60" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Cell Caps (6 cells) -->
    <circle cx="120" cy="75" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="168" cy="75" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="216" cy="75" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="264" cy="75" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="312" cy="75" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="360" cy="75" r="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

    <!-- Positive Terminal (Red) -->
    <rect x="80" y="42" width="28" height="24" rx="4" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
    <text x="94" y="59" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">+</text>
    
    <!-- Negative Terminal (Black/Blue) -->
    <rect x="350" y="42" width="28" height="24" rx="4" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
    <text x="364" y="59" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">−</text>

    <!-- Battery Front Label -->
    <rect x="85" y="125" width="290" height="135" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="105" y="160" font-family="sans-serif" font-size="20" font-weight="800" fill="#f8fafc">12V 70Ah 640A (EN)</text>
    <text x="105" y="185" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Technologie EFB / AGM Start-Stop</text>
    
    <!-- Charge Indicator Eye / Magic Eye -->
    <circle cx="320" cy="180" r="16" fill="url(#ledGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="320" cy="180" r="6" fill="#34d399"/>
    <text x="320" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">ÉTAT OK</text>
  </g>

  <!-- Digital Multimeter Probes Testing Voltage -->
  <g transform="translate(480, 110)">
    <!-- Multimeter Body -->
    <rect x="50" y="20" width="180" height="260" rx="20" fill="#d97706" stroke="#b45309" stroke-width="4"/>
    <rect x="62" y="32" width="156" height="236" rx="14" fill="#1e293b"/>
    
    <!-- LCD Screen -->
    <rect x="76" y="50" width="128" height="60" rx="6" fill="#042f2e" stroke="#0f766e" stroke-width="2"/>
    <text x="140" y="94" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" font-weight="900" fill="#34d399" letter-spacing="2" filter="url(#glow)">12.64</text>
    <text x="188" y="70" font-family="sans-serif" font-size="14" font-weight="800" fill="#2dd4bf">V</text>
    <text x="188" y="85" font-family="sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">DC</text>

    <!-- Rotary Dial -->
    <circle cx="140" cy="165" r="38" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <line x1="140" y1="165" x2="140" y2="135" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Test Leads Ports -->
    <circle cx="105" cy="235" r="9" fill="#111827" stroke="#dc2626" stroke-width="3"/>
    <circle cx="175" cy="235" r="9" fill="#111827" stroke="#000000" stroke-width="3"/>
    <text x="105" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ef4444">V/Ω</text>
    <text x="175" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">COM</text>
  </g>

  <!-- Test Cables Wires from Multimeter to Battery Terminals -->
  <path d="M 585 345 C 560 390, 230 420, 194 150" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 0"/>
  <path d="M 655 345 C 640 400, 480 390, 464 150" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Probe Needles -->
  <g transform="translate(194, 142)">
    <polygon points="0,0 -4,22 4,22" fill="#ef4444"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-12" r="4" fill="#facc15" filter="url(#glow)"/>
  </g>
  <g transform="translate(464, 142)">
    <polygon points="0,0 -4,22 4,22" fill="#38bdf8"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-12" r="4" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Mesure aux bornes moteur arrêté. 12.6V = 100% · 12.2V = 50% · &lt;11.9V = Décharge profonde.
    </text>
  </g>
</svg>