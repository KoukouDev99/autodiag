<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="exhaustPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="exhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid13" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad13)"/>
  <rect width="800" height="450" fill="url(#grid13)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="270" height="28" rx="6" fill="#4c1d95" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#a78bfa"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ddd6fe" letter-spacing="1.2">ÉCHAPPEMENT &amp; SONDE LAMBDA</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.8">TENSION LAMBDA : 0.1 - 0.9 V</text>
  </g>

  <!-- Exhaust Downpipe &amp; Catalytic Converter / O2 Sensor Schematic -->
  <g transform="translate(90, 100)">
    <!-- Exhaust Manifold Downpipe -->
    <path d="M 50 40 Q 50 140 120 160 L 230 160" fill="none" stroke="url(#exhaustPipe)" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Catalytic Converter Body (Canister) -->
    <g transform="translate(200, 125)">
      <rect x="0" y="0" width="160" height="70" rx="20" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Honeycomb Ceramic Monolith Inside (Cutaway) -->
      <g transform="translate(25, 12)">
        <rect width="110" height="46" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <line x1="20" y1="0" x2="20" y2="46" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 2"/>
        <line x1="40" y1="0" x2="40" y2="46" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 2"/>
        <line x1="60" y1="0" x2="60" y2="46" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 2"/>
        <line x1="80" y1="0" x2="80" y2="46" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 2"/>
      </g>
      <text x="80" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#fde047">CATALYSEUR / FAP</text>
    </g>

    <!-- Upstream Oxygen Lambda Sensor (Sonde Lambda Amont O2) -->
    <g transform="translate(130, 80)">
      <!-- Hex Screw Boss on Exhaust Pipe -->
      <rect x="0" y="40" width="22" height="15" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Sensor Body (Metal) -->
      <rect x="3" y="10" width="16" height="30" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
      <!-- Wiring Harness Sleeve (4 wires) -->
      <path d="M 11 10 C 11 -20, 60 -20, 80 0" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
      <text x="85" y="15" font-family="sans-serif" font-size="11" font-weight="800" fill="#c084fc">Sonde O2 (Amont)</text>
    </g>

    <!-- Downstream Exhaust Pipe -->
    <path d="M 360 160 L 420 160" fill="none" stroke="url(#exhaustPipe)" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Right: Lambda Sensor Signal Oscillations Card -->
  <g transform="translate(520, 110)">
    <rect width="240" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">CYCLE OSCILLATION LAMBDA</text>

    <!-- Graph Screen -->
    <rect x="20" y="50" width="200" height="100" rx="8" fill="#042f2e" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="20" y1="100" x2="220" y2="100" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="30" y="72" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#67e8f9">0.9V (Riche)</text>
    <text x="30" y="132" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#67e8f9">0.1V (Pauvre)</text>

    <!-- Sinusoidal Lambda Waveform (Healthy Switching Pattern) -->
    <path d="M 30 120 Q 50 65 70 120 T 110 120 T 150 120 T 190 120" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#exhGlow)"/>

    <!-- Exhaust Smoke Guide -->
    <g transform="translate(20, 160)">
      <rect width="200" height="60" rx="6" fill="#1e293b"/>
      <text x="10" y="18" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Analyse fumée d'échappement :</text>
      <text x="10" y="34" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#f87171">• Bleue : Consommation d'huile</text>
      <text x="10" y="48" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#93c5fd">• Blanche : Liquide de refroidissement</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Une sonde lambda saine doit osciller rapidement entre 0.1V et 0.9V au ralenti chaud (1 à 2 basculements/sec).
    </text>
  </g>
</svg>