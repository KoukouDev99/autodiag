<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="starterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  <rect width="800" height="450" fill="url(#grid3)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="240" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.2">DÉMARREUR &amp; SOLÉNOÏDE</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">RÉGIME ENTRAÎNÉ &gt; 200 TR/MIN</text>
  </g>

  <!-- Starter Motor &amp; Solenoid Schematic -->
  <g transform="translate(140, 95)">
    <!-- Main Motor Cylinder -->
    <rect x="180" y="130" width="280" height="130" rx="14" fill="url(#starterBody)" stroke="#475569" stroke-width="2.5"/>
    <!-- Motor Housing Ribs -->
    <line x1="240" y1="130" x2="240" y2="260" stroke="#334155" stroke-width="2"/>
    <line x1="320" y1="130" x2="320" y2="260" stroke="#334155" stroke-width="2"/>
    <line x1="400" y1="130" x2="400" y2="260" stroke="#334155" stroke-width="2"/>
    <text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#94a3b8" letter-spacing="2">MOTEUR 12V 1.4 kW</text>

    <!-- Rear Brush Cover -->
    <path d="M 460 145 C 485 145, 485 245, 460 245 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>

    <!-- Solenoid Assembly on Top -->
    <rect x="230" y="30" width="170" height="85" rx="10" fill="url(#starterBody)" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="315" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8">SOLÉNOÏDE</text>
    <text x="315" y="93" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Relais d'engagement</text>

    <!-- Solenoid Electrical Terminals -->
    <!-- Terminal 30 (Big Red 12V BATT) -->
    <circle cx="370" cy="50" r="9" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
    <text x="370" y="53" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff">30</text>
    <text x="415" y="54" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">+12V BATT</text>

    <!-- Terminal 50 (Excit Switch) -->
    <circle cx="370" cy="85" r="7" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="370" y="88" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#1e293b">50</text>
    <text x="415" y="89" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Signal Neiman</text>

    <!-- Drive Flange &amp; Pinion Bendix Gear Housing -->
    <path d="M 180 145 L 80 160 L 80 230 L 180 245 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Pinion Bendix Gear (Teeth to Flywheel) -->
    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="45" height="40" rx="3" fill="url(#copper)" stroke="#92400e" stroke-width="1.5" filter="url(#gearGlow)"/>
      <!-- Gear Teeth -->
      <line x1="8" y1="-5" x2="8" y2="45" stroke="#78350f" stroke-width="3"/>
      <line x1="18" y1="-5" x2="18" y2="45" stroke="#78350f" stroke-width="3"/>
      <line x1="28" y1="-5" x2="28" y2="45" stroke="#78350f" stroke-width="3"/>
      <line x1="38" y1="-5" x2="38" y2="45" stroke="#78350f" stroke-width="3"/>
      <text x="22" y="56" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24">Pignon 9 Dents</text>
    </g>

    <!-- Flywheel Ring Gear Target -->
    <g transform="translate(-10, 120)">
      <path d="M 20 0 L 20 150" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-dasharray="8 6"/>
      <text x="-15" y="75" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" transform="rotate(-90 -15,75)">Couronne Moteur</text>
    </g>

    <!-- Test Probe Arrow pointing to Terminal 50 -->
    <g transform="translate(340, -15)">
      <path d="M 0 0 L 25 35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <polygon points="25,35 15,30 20,22" fill="#f59e0b"/>
      <rect x="-110" y="-12" width="110" height="24" rx="4" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
      <text x="-55" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fef3c7">Test impulsion 12V</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Si « clic » sec sans rotation → Contacteur solénoïde ou charbons usés. Si silence complet → Faisceau borne 50 / Neiman.
    </text>
  </g>
</svg>