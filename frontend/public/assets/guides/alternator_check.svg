<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="altMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="altGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad4)"/>
  <rect width="800" height="450" fill="url(#grid4)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="250" height="28" rx="6" fill="#047857" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#34d399"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.2">ALTERNATEUR &amp; CHARGE</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(540, 36)">
    <rect width="220" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="110" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.8">TENSION EN CHARGE : 13.8 - 14.5 V</text>
  </g>

  <!-- Alternator Housing &amp; Ribbed Pulley Diagram -->
  <g transform="translate(100, 100)">
    <!-- Main Stator Cylinder with Air Vents -->
    <circle cx="210" cy="140" r="120" fill="url(#altMetal)" stroke="#64748b" stroke-width="3"/>
    
    <!-- Ventilation Cooling Slots (Radial) -->
    <g transform="translate(210, 140)">
      <circle cx="0" cy="0" r="75" fill="none" stroke="#0f172a" stroke-width="18" stroke-dasharray="14 10"/>
      <!-- Inner Copper Windings Glow -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="8 6" opacity="0.8"/>
      <!-- Center Rotor Shaft Hub -->
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#0f172a"/>
    </g>

    <!-- Front Drive Pulley (Ribbed Serpentine Poly-V) -->
    <g transform="translate(70, 70)">
      <circle cx="0" cy="70" r="48" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="0" cy="70" r="38" fill="none" stroke="#475569" stroke-width="3"/>
      <!-- Serpentine Belt Segment Wrapping Around Pulley -->
      <path d="M 0 22 C -40 22, -40 118, 0 118" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
      <!-- Ribs -->
      <path d="M 0 22 C -40 22, -40 118, 0 118" fill="none" stroke="#1e293b" stroke-width="2"/>
      <text x="-60" y="74" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Courroie 6PK</text>
    </g>

    <!-- Rear Voltage Regulator Box &amp; Diode Pack -->
    <g transform="translate(290, 80)">
      <rect x="0" y="0" width="85" height="110" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
      <text x="42" y="30" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">RÉGULATEUR</text>
      <!-- B+ Terminal Bolt (Red) -->
      <circle cx="42" cy="65" r="9" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
      <text x="42" y="68" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff">B+</text>
      <text x="42" y="92" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">Vers Batterie</text>
    </g>

    <!-- Mounting Flange Brackets -->
    <path d="M 170 20 L 250 20 L 235 45 L 185 45 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="210" cy="30" r="6" fill="#0f172a"/>
  </g>

  <!-- Multimeter Readout Card During Engine Running -->
  <g transform="translate(520, 110)">
    <rect width="240" height="230" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">MESURE MOTEUR TOURNANT :</text>
    
    <!-- Big Digital Readout 14.2V -->
    <rect x="20" y="48" width="200" height="70" rx="8" fill="#042f2e" stroke="#0f766e" stroke-width="2"/>
    <text x="110" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="900" fill="#34d399" filter="url(#altGlow)">14.28 V</text>

    <!-- Status Analysis Box -->
    <g transform="translate(20, 135)">
      <rect width="200" height="75" rx="6" fill="#1e293b"/>
      <circle cx="18" cy="22" r="5" fill="#10b981"/>
      <text x="32" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Alternateur Conforme</text>
      
      <circle cx="18" cy="46" r="5" fill="#ef4444"/>
      <text x="32" y="50" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">&lt; 13.2V : Sous-charge (Panne)</text>
      
      <circle cx="18" cy="65" r="5" fill="#f59e0b"/>
      <text x="32" y="69" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">&gt; 15.0V : Régulateur HS (Risque)</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Moteur au ralenti avec phares et dégivrage allumés, la tension batterie doit rester entre 13.8V et 14.5V.
    </text>
  </g>
</svg>