<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <filter id="dmmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid15" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad15)"/>
  <rect width="800" height="450" fill="url(#grid15)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="260" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.2">MESURE MULTIMÈTRE DMM</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">RÉSISTANCE DE LIGNE &lt; 0.5 Ω</text>
  </g>

  <!-- Digital Multimeter Workshop Body &amp; Probes -->
  <g transform="translate(130, 95)">
    <!-- Yellow Ruggedized Holster Case -->
    <rect x="70" y="10" width="230" height="280" rx="22" fill="#d97706" stroke="#b45309" stroke-width="4"/>
    <rect x="84" y="24" width="202" height="252" rx="16" fill="#1e293b"/>

    <!-- Large Backlit LCD Display -->
    <rect x="100" y="42" width="170" height="75" rx="8" fill="#042f2e" stroke="#0f766e" stroke-width="2"/>
    <!-- Digital Value 0.00 Ohms Continuity Beep -->
    <text x="185" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="900" fill="#34d399" filter="url(#dmmGlow)">0.02</text>
    <text x="245" y="68" font-family="sans-serif" font-size="18" font-weight="900" fill="#2dd4bf">Ω</text>
    <!-- Beeper Audio Symbol -->
    <path d="M 120 65 Q 125 70 120 75" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M 125 60 Q 133 70 125 80" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <text x="140" y="72" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">CONTINUITÉ OK</text>

    <!-- Rotary Switch Dial -->
    <circle cx="185" cy="180" r="45" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <circle cx="185" cy="180" r="35" fill="#1e293b"/>
    <line x1="185" y1="180" x2="160" y2="150" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Position Labels around Dial -->
    <text x="145" y="145" font-family="sans-serif" font-size="11" font-weight="900" fill="#facc15">Ω</text>
    <text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#94a3b8">V=</text>
    <text x="225" y="145" font-family="sans-serif" font-size="11" font-weight="800" fill="#94a3b8">V~</text>
    <text x="235" y="185" font-family="sans-serif" font-size="11" font-weight="800" fill="#94a3b8">A=</text>
    <text x="135" y="185" font-family="sans-serif" font-size="11" font-weight="800" fill="#ef4444">OFF</text>

    <!-- 4mm Banana Input Jacks -->
    <circle cx="140" cy="250" r="9" fill="#111827" stroke="#dc2626" stroke-width="3"/>
    <text x="140" y="272" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ef4444">V/Ω</text>

    <circle cx="230" cy="250" r="9" fill="#111827" stroke="#000000" stroke-width="3"/>
    <text x="230" y="272" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#94a3b8">COM</text>
  </g>

  <!-- Probes and Leads on Connector Wire Test -->
  <g transform="translate(420, 150)">
    <!-- Positive Red Lead -->
    <path d="M -150 195 Q -60 220 -20 120" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <!-- Red Probe Needle -->
    <g transform="translate(-20, 120) rotate(-45)">
      <rect x="-6" y="0" width="12" height="70" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <line x1="0" y1="70" x2="0" y2="105" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="105" r="4" fill="#facc15" filter="url(#dmmGlow)"/>
    </g>

    <!-- Negative Black Lead -->
    <path d="M -60 195 Q 30 220 70 120" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <!-- Black Probe Needle -->
    <g transform="translate(70, 120) rotate(45)">
      <rect x="-6" y="0" width="12" height="70" rx="3" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="0" y1="70" x2="0" y2="105" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="105" r="4" fill="#38bdf8" filter="url(#dmmGlow)"/>
    </g>

    <!-- Component Terminal Under Test -->
    <rect x="-10" y="150" width="80" height="25" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="10" cy="162" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="162" r="5" fill="#f59e0b"/>
  </g>

  <!-- Right: Multimeter Modes Guide Card -->
  <g transform="translate(540, 110)">
    <rect width="220" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="110" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">GUIDE DES CALIBRES DMM</text>

    <!-- Mode 1: Voltmeter 20V DC -->
    <g transform="translate(15, 50)">
      <rect width="190" height="45" rx="6" fill="#1e293b"/>
      <text x="10" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">20V DC (Continu)</text>
      <text x="10" y="34" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Batterie, capteurs, signaux 12V</text>
    </g>

    <!-- Mode 2: Ohmmeter &amp; Continuity -->
    <g transform="translate(15, 105)">
      <rect width="190" height="45" rx="6" fill="#1e293b"/>
      <text x="10" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">Continuité / Bip (Ω)</text>
      <text x="10" y="34" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Fusibles, bobines, faisceaux</text>
    </g>

    <!-- Mode 3: Ammeter mA -->
    <g transform="translate(15, 160)">
      <rect width="190" height="45" rx="6" fill="#1e293b"/>
      <text x="10" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24">10A / mA DC</text>
      <text x="10" y="34" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Recherche de fuite de courant</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Coupez le contact pour les mesures de résistance (Ω). La pointe rouge sur V/Ω et la noire sur COM.
    </text>
  </g>
</svg>