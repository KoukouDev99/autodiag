<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="tireRubber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="tireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid12" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad12)"/>
  <rect width="800" height="450" fill="url(#grid12)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="260" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.2">PNEUMATIQUES &amp; GÉOMÉTRIE</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">TÉMOIN LÉGAL : &gt; 1.6 MM</text>
  </g>

  <!-- Tire Cross Section &amp; Tread Depth Gauge Schematic -->
  <g transform="translate(100, 100)">
    <!-- Tire Profile &amp; Wheel Rim -->
    <g transform="translate(40, 20)">
      <!-- Outer Rubber Tire Tread Contour -->
      <path d="M 40 40 C 20 40, 10 90, 10 160 C 10 230, 20 280, 40 280 L 160 280 C 180 280, 190 230, 190 160 C 190 90, 180 40, 160 40 Z" fill="url(#tireRubber)" stroke="#64748b" stroke-width="3"/>
      
      <!-- Inner Alloy Wheel Rim Center -->
      <circle cx="100" cy="160" r="58" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="100" cy="160" r="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      
      <!-- Tread Grooves (Rain Channels) -->
      <path d="M 12 110 L 35 110" stroke="#0f172a" stroke-width="5"/>
      <path d="M 10 135 L 35 135" stroke="#0f172a" stroke-width="5"/>
      <path d="M 10 160 L 35 160" stroke="#0f172a" stroke-width="5"/>
      <path d="M 10 185 L 35 185" stroke="#0f172a" stroke-width="5"/>
      <path d="M 12 210 L 35 210" stroke="#0f172a" stroke-width="5"/>

      <!-- Valve Stem with TPMS Sensor Core -->
      <rect x="135" y="125" width="22" height="10" rx="2" fill="#d97706" transform="rotate(45 135,125)"/>
      <text x="100" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8">205/55 R16 91V</text>
    </g>

    <!-- Tread Depth Vernier Gauge (Jauge de profondeur de sculpture) -->
    <g transform="translate(260, 40)">
      <rect x="0" y="0" width="85" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <!-- Digital LCD -->
      <rect x="10" y="15" width="65" height="30" rx="4" fill="#042f2e" stroke="#0f766e" stroke-width="1.5"/>
      <text x="42" y="36" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#34d399">5.4</text>
      <text x="65" y="27" font-family="sans-serif" font-size="8" font-weight="700" fill="#2dd4bf">mm</text>
      
      <!-- Measuring Probe Pin -->
      <rect x="38" y="150" width="8" height="60" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
      <polygon points="38,210 42,218 46,210" fill="#cbd5e1"/>

      <!-- TWI (Tread Wear Indicator) Triangle Label -->
      <polygon points="42,75 32,90 52,90" fill="#f59e0b"/>
      <text x="42" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#fbbf24">▲ TWI</text>
    </g>
  </g>

  <!-- Right: Pressure &amp; Wear Evaluation Card -->
  <g transform="translate(520, 110)">
    <rect width="240" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">CONTRÔLE PRESSION À FROID</text>

    <!-- Manometer Pressure Gauge (2.3 bar) -->
    <g transform="translate(120, 85)">
      <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#38bdf8">2.4 BAR</text>
      <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8">35 PSI (OK)</text>
    </g>

    <!-- Wear Patterns Warning List -->
    <g transform="translate(20, 135)">
      <rect width="200" height="85" rx="6" fill="#1e293b"/>
      <text x="10" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Analyse de l'usure de bande :</text>
      <text x="10" y="38" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#fca5a5">• Épaulements usés : Sous-gonflage</text>
      <text x="10" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#fde047">• Centre usé : Sur-gonflage</text>
      <text x="10" y="70" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#93c5fd">• Un seul côté usé : Parallélisme</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Repérez le repère « TWI » sur le flanc. La gomme ne doit jamais affleurer le témoin de 1.6 mm.
    </text>
  </g>
</svg>