<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="fuelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="gaugeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad5)"/>
  <rect width="800" height="450" fill="url(#grid5)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="260" height="28" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1.2">ALIMENTATION CARBURANT</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">PRESSION RAMPE : 3.5 - 4.0 BAR</text>
  </g>

  <!-- Fuel Pump &amp; Tank Modular Unit Schematic -->
  <g transform="translate(90, 100)">
    <!-- Tank Flange Ring Cover -->
    <ellipse cx="180" cy="40" rx="110" ry="24" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
    <!-- Electrical 4-pin Harness Connector -->
    <rect x="150" y="15" width="60" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="165" cy="26" r="3" fill="#38bdf8"/>
    <circle cx="175" cy="26" r="3" fill="#38bdf8"/>
    <circle cx="185" cy="26" r="3" fill="#38bdf8"/>
    <circle cx="195" cy="26" r="3" fill="#38bdf8"/>
    
    <!-- Fuel Outlet Quick-Connector Nipple (Blue) -->
    <path d="M 225 25 L 225 0 L 255 0" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Vertical Guide Rods (Suspension springs) -->
    <line x1="110" y1="50" x2="110" y2="180" stroke="#94a3b8" stroke-width="4"/>
    <line x1="250" y1="50" x2="250" y2="180" stroke="#94a3b8" stroke-width="4"/>
    
    <!-- Spiral Fuel Tube -->
    <path d="M 215 50 Q 230 90 200 110 T 215 170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 3"/>

    <!-- Reservoir Swirl Pot (Bol de déjaugeage) -->
    <rect x="95" y="160" width="170" height="130" rx="12" fill="url(#fuelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">POMPE IMMERGÉE</text>
    <text x="180" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#93c5fd">12V · Débit 120 L/h</text>

    <!-- Fuel Level Float Arm &amp; Rheostat -->
    <line x1="95" y1="190" x2="30" y2="240" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="10" y="230" width="30" height="18" rx="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="25" y="260" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fbbf24">Flotteur</text>

    <!-- Bottom Suction Strainer Mesh Filter -->
    <path d="M 110 290 C 110 310, 250 310, 250 290 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="180" y="303" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#cbd5e1">Crépine de fond</text>
  </g>

  <!-- Fuel Pressure Gauge / Manometer Dial -->
  <g transform="translate(520, 110)">
    <rect width="240" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">TEST DE PRESSION D'ESSENCE</text>
    
    <!-- Circular Pressure Gauge Dial -->
    <g transform="translate(120, 125)">
      <circle cx="0" cy="0" r="65" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <circle cx="0" cy="0" r="55" fill="#1e293b"/>
      
      <!-- Green Safe Zone Arc (3.0 to 4.0 Bar) -->
      <path d="M 0 -50 A 50 50 0 0 1 45 -22" fill="none" stroke="#10b981" stroke-width="6"/>
      <text x="18" y="-36" font-family="sans-serif" font-size="8" font-weight="800" fill="#34d399">OK</text>

      <!-- Tick Marks -->
      <line x1="-35" y1="20" x2="-28" y2="16" stroke="#64748b" stroke-width="2"/>
      <line x1="-45" y1="-10" x2="-37" y2="-8" stroke="#64748b" stroke-width="2"/>
      <line x1="-30" y1="-35" x2="-25" y2="-29" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="-48" x2="0" y2="-40" stroke="#64748b" stroke-width="2"/>
      <line x1="30" y1="-35" x2="25" y2="-29" stroke="#64748b" stroke-width="2"/>
      
      <!-- Manometer Needle (Pointing to 3.8 bar) -->
      <line x1="0" y1="0" x2="24" y2="-36" stroke="#ef4444" stroke-width="3" stroke-linecap="round" filter="url(#gaugeGlow)"/>
      <circle cx="0" cy="0" r="7" fill="#dc2626"/>

      <!-- Digital Sub-Readout -->
      <text x="0" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#38bdf8">3.8 BAR</text>
    </g>

    <text x="120" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Amorçage &amp; Débit Conformes</text>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Écoutez le sifflement « bzz » de 2 secondes sous la banquette arrière à la mise sous contact.
    </text>
  </g>
</svg>