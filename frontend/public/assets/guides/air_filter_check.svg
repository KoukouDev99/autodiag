<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="airGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid10" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad10)"/>
  <rect width="800" height="450" fill="url(#grid10)"/>

  <!-- Technical Header Tag -->
  <g transform="translate(40, 36)">
    <rect width="260" height="28" rx="6" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1.2">FILTRE À AIR &amp; ADMISSION</text>
  </g>

  <!-- Spec Badge -->
  <g transform="translate(560, 36)">
    <rect width="200" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">RENOUVELLEMENT : 20 000 KM</text>
  </g>

  <!-- Pleated Air Filter &amp; MAF Duct Schematic -->
  <g transform="translate(100, 100)">
    <!-- Airbox Plastic Casing Upper Lid (Opened) -->
    <path d="M 40 40 L 260 20 L 280 60 L 60 80 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    
    <!-- Airbox Lower Base Housing -->
    <rect x="50" y="140" width="220" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>

    <!-- Pleated Air Filter Element (Cartouche filtrante plissée) -->
    <g transform="translate(60, 90)">
      <!-- Orange Rubber Seal Perimeter -->
      <rect x="0" y="0" width="200" height="65" rx="6" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
      <!-- Inner Paper Accordion Pleats (Clean Yellow/Orange) -->
      <g transform="translate(8, 8)">
        <rect width="184" height="49" fill="url(#filterGrad)"/>
        <!-- Pleat Folds -->
        <line x1="12" y1="0" x2="12" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="24" y1="0" x2="24" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="36" y1="0" x2="36" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="48" y1="0" x2="48" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="60" y1="0" x2="60" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="72" y1="0" x2="72" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="84" y1="0" x2="84" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="96" y1="0" x2="96" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="108" y1="0" x2="108" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="120" y1="0" x2="120" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="132" y1="0" x2="132" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="144" y1="0" x2="144" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="156" y1="0" x2="156" y2="49" stroke="#78350f" stroke-width="2"/>
        <line x1="168" y1="0" x2="168" y2="49" stroke="#78350f" stroke-width="2"/>
      </g>
    </g>

    <!-- Air Intake Conduit Pipe &amp; MAF Sensor (Débitmètre) -->
    <g transform="translate(260, 160)">
      <path d="M 0 20 L 140 20 L 140 80 L 0 80 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <!-- Airflow Arrow (Blue Stream) -->
      <path d="M 20 50 L 110 50" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 4" filter="url(#airGlow)"/>
      <polygon points="120,50 108,44 108,56" fill="#38bdf8"/>
      
      <!-- MAF Hot Wire Sensor (Débitmètre d'air) -->
      <rect x="55" y="0" width="30" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="70" cy="12" r="3" fill="#38bdf8"/>
      <text x="70" y="-8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#38bdf8">DÉBITMÈTRE</text>
    </g>
  </g>

  <!-- Inspection Quality Card -->
  <g transform="translate(520, 110)">
    <rect width="240" height="235" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">CONTRÔLE DE COLMATAGE</text>

    <!-- Inspection Criteria -->
    <g transform="translate(20, 50)">
      <rect width="200" height="45" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="22" r="7" fill="#10b981"/>
      <text x="36" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Filtre Jaune / Propre</text>
      <text x="36" y="34" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Passage d'air optimal</text>
    </g>

    <g transform="translate(20, 105)">
      <rect width="200" height="45" rx="6" fill="#1e293b"/>
      <circle cx="20" cy="22" r="7" fill="#ef4444"/>
      <text x="36" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">Filtre Noirci / Feuilles</text>
      <text x="36" y="34" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Étouffement · Surconsommation</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="200" height="55" rx="6" fill="#1e293b"/>
      <text x="12" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Symptômes d'un filtre colmaté :</text>
      <text x="12" y="36" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#fbbf24">• Perte de reprise à l'accélération</text>
      <text x="12" y="48" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#fbbf24">• Fumée noire à l'échappement</text>
    </g>
  </g>

  <!-- Technical Callout Footnote -->
  <g transform="translate(40, 395)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Point de contrôle : Ouvrez les 4 clips du boîtier de filtre à air. Tapotez la cartouche ou remplacez-la si les plis sont noirs.
    </text>
  </g>
</svg>